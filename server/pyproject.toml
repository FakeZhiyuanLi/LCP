[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcp-server"
version = "0.1.0"
description = "Finalized audio ingestion, selectable STT transcription, and Drive publication"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
runtime = ["faster-whisper>=1.1,<2", "av>=11,<19", "watchdog>=4,<7"]
watch = ["watchdog>=4,<7"]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
lcp-worker = "lcp_server.cli:main"
lcp-drive-classes = "lcp_server.catalog_cli:main"
lcp-dashboard = "lcp_server.dashboard:main"

[tool.setuptools.packages.find]
include = ["lcp_server*"]

[tool.setuptools.package-data]
lcp_server = ["dashboard_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
