[Service]
Environment=LCP_RCLONE=rclone
EnvironmentFile=%h/.config/lcp/drive.env
ExecStart=
ExecStart=%h/.local/share/lcp/venv/bin/lcp-worker watch --root /data/lectures --transcriber elevenlabs --elevenlabs-model scribe_v2 --elevenlabs-diarize --elevenlabs-local-fallback --automatic-repair --max-automatic-repairs 1 --publish --remote gdrive --rclone ${LCP_RCLONE} --drive-root-folder-id ${LCP_DRIVE_ROOT_FOLDER_ID}
